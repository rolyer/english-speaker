[project]
name = "speaker-backend"
version = "0.1.0"
description = "小学生英语口语训练WEB应用后端"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.2",
    "langchain-ollama>=0.0.1",
    "openai>=1.3.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.0.0",
    "edge-tts>=6.1.0",
    "openai-whisper>=20231117",
    "torch>=2.0,<2.3",  # torch 2.3+ 在 macOS x86_64 上不可用，使用 2.2.x
    "numba>=0.63",  # numba 0.63+ 支持 Python 3.12
    "llvmlite>=0.46",  # llvmlite 0.46+ 支持 Python 3.12
    "numpy<2",  # NumPy 2.x 与 torch 2.2.2 不兼容
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

